name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # FontAwesome Pro vive en un registro propio. El .npmrc del repo
        # interpola esta variable, asi que sin ella npm ci corta con E401 y los
        # tests no llegan a correr.
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: npm ci

      - name: Run unit tests
        run: npm run test
